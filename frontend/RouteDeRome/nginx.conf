# Configuration Nginx pour Progressive Web App
# À adapter à votre configuration Nginx existante

# Bloc serveur de base
server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2; # Décommenter pour HTTPS
    # listen [::]:443 ssl http2;
    
    server_name example.com www.example.com;
    
    # Chemins des fichiers SSL (si HTTPS)
    # ssl_certificate /chemin/vers/certificat.crt;
    # ssl_certificate_key /chemin/vers/cle.key;
    
    # Répertoire racine de l'application
    root /var/www/routederome/dist;
    index index.html index.htm;
    
    # Redirection HTTP vers HTTPS (si HTTPS)
    # if ($scheme != "https") {
    #     return 301 https://$server_name$request_uri;
    # }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/html text/plain text/xml text/css text/javascript application/javascript application/json;
    
    # Types MIME personnalisés
    types {
        application/json json;
        application/manifest+json webmanifest;
        text/javascript js;
    }
    
    # Service Worker - Ne JAMAIS le mettre en cache navigateur
    location = /sw.js {
        add_header Cache-Control "max-age=0, must-revalidate, no-cache, no-store";
        add_header Service-Worker-Allowed "/";
        expires off;
        access_log off;
    }
    
    # Manifest.json - Cache court (1 jour)
    location ~ \.json$ {
        add_header Cache-Control "max-age=86400, public, must-revalidate";
        expires 1d;
    }
    
    # browserconfig.xml pour Windows
    location = /browserconfig.xml {
        add_header Cache-Control "max-age=86400, public, must-revalidate";
        expires 1d;
    }
    
    # Fichiers HTML - Ne pas mettre en cache
    location ~ \.html?$ {
        add_header Cache-Control "max-age=0, must-revalidate, no-cache, no-store";
        add_header Content-Type "text/html; charset=utf-8";
        expires off;
    }
    
    # Assets statiques (CSS, JS, images) - Cache long (1 an)
    location ~ \.(css|js|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot|ico)$ {
        add_header Cache-Control "max-age=31536000, public, immutable";
        expires 365d;
        access_log off;
    }
    
    # Médias (audio, vidéo) - Cache long
    location ~ \.(mp3|mp4|webm|ogg|wav)$ {
        add_header Cache-Control "max-age=31536000, public, immutable";
        expires 365d;
        access_log off;
    }
    
    # Polices - CORS et cache
    location ~ \.(ttf|otf|eot|woff|woff2)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "max-age=31536000, public, immutable";
        expires 365d;
        access_log off;
    }
    
    # Router pour SPA (Single Page Application)
    # Rediriger toutes les routes non trouvées vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Sécurité - Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; media-src 'self' data:; object-src 'none';" always;
    
    # Logs
    access_log /var/log/nginx/routederome-access.log;
    error_log /var/log/nginx/routederome-error.log;
}
